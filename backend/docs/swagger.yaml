basePath: /api/v1
definitions:
  main.ErrorResponse:
    description: Standard error response format
    properties:
      code:
        example: NOT_FOUND
        type: string
      details:
        example: The requested item could not be found
        type: string
      error:
        example: Item not found
        type: string
    type: object
  main.Item:
    description: A clothing item with basic information
    properties:
      category:
        example: Top
        type: string
      id:
        example: "1"
        type: string
      imageUrl:
        example: https://via.placeholder.com/150
        type: string
      name:
        example: White T-Shirt
        type: string
    required:
    - category
    - id
    - imageUrl
    - name
    type: object
  main.Outfit:
    description: A combination of clothing items forming an outfit
    properties:
      id:
        example: "1"
        type: string
      itemIds:
        example:
        - "1"
        - "2"
        - "3"
        items:
          type: string
        type: array
      name:
        example: Casual Look
        type: string
    required:
    - id
    - itemIds
    - name
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Standard success response format
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Slay Drip API
  version: "1.0"
paths:
  /health:
    get:
      consumes:
      - application/json
      description: Check if the API is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - health
  /items:
    get:
      consumes:
      - application/json
      description: Retrieve all clothing items
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.Item'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Get all items
      tags:
      - items
    post:
      consumes:
      - application/json
      description: Create a new clothing item
      parameters:
      - description: Item information
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/main.Item'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.Item'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Create a new item
      tags:
      - items
  /items/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve a specific clothing item by its ID
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Item'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Get item by ID
      tags:
      - items
  /outfits:
    get:
      consumes:
      - application/json
      description: Retrieve all outfits
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.Outfit'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Get all outfits
      tags:
      - outfits
    post:
      consumes:
      - application/json
      description: Create a new outfit with specified items
      parameters:
      - description: Outfit information
        in: body
        name: outfit
        required: true
        schema:
          $ref: '#/definitions/main.Outfit'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.Outfit'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Create a new outfit
      tags:
      - outfits
  /outfits/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve a specific outfit by its ID
      parameters:
      - description: Outfit ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Outfit'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Get outfit by ID
      tags:
      - outfits
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
