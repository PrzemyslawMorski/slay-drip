name: Frontend Build & Deploy Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build-deploy.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Build and deploy environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production
      skip_tests:
        description: 'Skip running tests'
        required: false
        default: false
        type: boolean
      skip_lint:
        description: 'Skip linting'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '24'
  AWS_REGION: us-east-1
  TF_VERSION: '1.5.0'

jobs:
  terraform-outputs:
    runs-on: ubuntu-latest
    outputs:
      api_gateway_url: ${{ steps.get-outputs.outputs.api_gateway_url }}
      frontend_s3_bucket: ${{ steps.get-outputs.outputs.frontend_s3_bucket }}
      cloudfront_distribution_id: ${{ steps.get-outputs.outputs.cloudfront_distribution_id }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Get Terraform Outputs
        id: get-outputs
        working-directory: terraform
        run: |
          # Initialize Terraform
          terraform init
          
          # Get outputs from Terraform state
          echo "Reading Terraform outputs..."
          
          # Get API Gateway URL
          API_GATEWAY_URL=$(terraform output -raw api_gateway_url 2>/dev/null || echo "")
          if [[ -n "$API_GATEWAY_URL" ]]; then
            echo "api_gateway_url=$API_GATEWAY_URL" >> $GITHUB_OUTPUT
            echo "✅ Found API Gateway URL: $API_GATEWAY_URL"
          else
            echo "api_gateway_url=" >> $GITHUB_OUTPUT
            echo "⚠️  No API Gateway URL found in Terraform outputs"
          fi
          
          # Get Frontend S3 Bucket
          FRONTEND_S3_BUCKET=$(terraform output -raw frontend_s3_bucket 2>/dev/null || echo "")
          if [[ -n "$FRONTEND_S3_BUCKET" ]]; then
            echo "frontend_s3_bucket=$FRONTEND_S3_BUCKET" >> $GITHUB_OUTPUT
            echo "✅ Found Frontend S3 Bucket: $FRONTEND_S3_BUCKET"
          else
            echo "frontend_s3_bucket=" >> $GITHUB_OUTPUT
            echo "⚠️  No Frontend S3 Bucket found in Terraform outputs"
          fi
          
          # Get CloudFront Distribution ID
          CLOUDFRONT_DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id 2>/dev/null || echo "")
          if [[ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]]; then
            echo "cloudfront_distribution_id=$CLOUDFRONT_DISTRIBUTION_ID" >> $GITHUB_OUTPUT
            echo "✅ Found CloudFront Distribution ID: $CLOUDFRONT_DISTRIBUTION_ID"
          else
            echo "cloudfront_distribution_id=" >> $GITHUB_OUTPUT
            echo "⚠️  No CloudFront Distribution ID found in Terraform outputs"
          fi
          
          # Show all outputs for debugging
          echo ""
          echo "=== Terraform Outputs Summary ==="
          terraform output
          echo "================================="

  build:
    needs: terraform-outputs
    runs-on: ubuntu-latest
    outputs:
      build-artifact: ${{ steps.build.outputs.build-artifact }}
      environment: ${{ steps.build.outputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Build Frontend
        id: build
        working-directory: frontend
        run: |
          # Install dependencies
          npm ci
          
          # Determine environment
          if [[ "${{ github.event.inputs.environment }}" == "production" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENVIRONMENT="production"
            API_GATEWAY_URL="${{ needs.terraform-outputs.outputs.api_gateway_url }}"
          else
            ENVIRONMENT="development"
            API_GATEWAY_URL=""
          fi
          
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          
          # Prepare environment configuration
          if [[ "$ENVIRONMENT" == "production" && -n "$API_GATEWAY_URL" ]]; then
            echo "Preparing production environment with API Gateway URL: $API_GATEWAY_URL"
            
            # Create temporary configuration
            mkdir -p temp-config
            cp src/config/environment.template.ts temp-config/environment.ts
            
            # Replace placeholder with actual URL
            sed -i "s|__API_GATEWAY_URL__|$API_GATEWAY_URL|g" temp-config/environment.ts
            
            # Verify replacement
            if grep -q "__API_GATEWAY_URL__" temp-config/environment.ts; then
              echo "::error::Failed to replace API Gateway URL placeholder"
              exit 1
            fi
            
            # Backup and replace environment file
            cp src/config/environment.ts src/config/environment.ts.backup
            cp temp-config/environment.ts src/config/environment.ts
          fi
          
          # Run tests (unless skipped)
          if [[ "${{ github.event.inputs.skip_tests }}" != "true" ]]; then
            echo "Running tests..."
            npm test
          else
            echo "Skipping tests as requested"
          fi
          
          # Run linting (unless skipped)
          if [[ "${{ github.event.inputs.skip_lint }}" != "true" ]]; then
            echo "Running linting..."
            npm run lint
          else
            echo "Skipping linting as requested"
          fi
          
          # Build frontend
          if [[ "$ENVIRONMENT" == "production" ]]; then
            echo "Building for production..."
            npm run build:live
          else
            echo "Building for development..."
            npm run build:dev
          fi
          
          # Verify build output
          if [[ ! -d "dist" ]]; then
            echo "::error::Build output directory 'dist' not found"
            exit 1
          fi
          
          # Create build artifact
          tar -czf ../frontend-build.tar.gz dist/
          echo "build-artifact=frontend-build.tar.gz" >> $GITHUB_OUTPUT
          
          # Cleanup temporary files
          if [[ -f "src/config/environment.ts.backup" ]]; then
            cp src/config/environment.ts.backup src/config/environment.ts
            rm src/config/environment.ts.backup
          fi
          if [[ -d "temp-config" ]]; then
            rm -rf temp-config
          fi
          
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ steps.build.outputs.environment }}
          path: frontend/frontend-build.tar.gz
          retention-days: 7

  deploy-development:
    needs: [terraform-outputs, build]
    runs-on: ubuntu-latest
    if: needs.build.outputs.environment == 'development'
    environment: development
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-development
          path: frontend-build
          
      - name: Deploy to Development
        run: |
          echo "Deploying to development environment..."
          echo "This would typically deploy to a development S3 bucket or local environment"
          echo "Build artifact downloaded to: frontend-build/"
          
          # Extract build artifact
          cd frontend-build
          tar -xzf frontend-build.tar.gz
          
          echo "Build contents:"
          ls -la dist/
          
          echo "Development deployment completed (simulated)"

  deploy-production:
    needs: [terraform-outputs, build]
    runs-on: ubuntu-latest
    if: needs.build.outputs.environment == 'production'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-production
          path: frontend-build
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Deploy to S3
        run: |
          echo "Deploying to production S3 bucket..."
          
          # Extract build artifact
          cd frontend-build
          tar -xzf frontend-build.tar.gz
          
          # Get S3 bucket name from Terraform outputs
          S3_BUCKET="${{ needs.terraform-outputs.outputs.frontend_s3_bucket }}"
          
          if [[ -z "$S3_BUCKET" ]]; then
            echo "::error::S3 bucket name not found in Terraform outputs. Check terraform/frontend.tf for frontend_s3_bucket output."
            exit 1
          fi
          
          echo "Deploying to S3 bucket: $S3_BUCKET"
          
          # Sync build output to S3
          aws s3 sync dist/ s3://$S3_BUCKET/ --delete --cache-control "max-age=31536000,public"
          
          # Invalidate CloudFront distribution if configured
          CLOUDFRONT_ID="${{ needs.terraform-outputs.outputs.cloudfront_distribution_id }}"
          if [[ -n "$CLOUDFRONT_ID" ]]; then
            echo "Invalidating CloudFront distribution: $CLOUDFRONT_ID"
            aws cloudfront create-invalidation \
              --distribution-id $CLOUDFRONT_ID \
              --paths "/*"
          else
            echo "No CloudFront distribution configured, skipping invalidation"
          fi
          
          echo "Production deployment completed successfully"
          
      - name: Notify Deployment
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "✅ Frontend deployed successfully to production"
            echo "🌐 URL: https://${{ needs.terraform-outputs.outputs.frontend_s3_bucket }}.s3-website-${{ env.AWS_REGION }}.amazonaws.com"
          else
            echo "❌ Frontend deployment failed"
          fi

  post-deploy:
    needs: [deploy-development, deploy-production]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Deployment Summary
        run: |
          echo "## 🚀 Frontend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ needs.build.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Status**: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Status**: ${{ needs.deploy-development.result == 'success' || needs.deploy-production.result == 'success' && '✅ Success' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.build.outputs.environment }}" == "production" ]]; then
            echo "- **API Gateway URL**: ${{ needs.terraform-outputs.outputs.api_gateway_url }}" >> $GITHUB_STEP_SUMMARY
            echo "- **S3 Bucket**: ${{ needs.terraform-outputs.outputs.frontend_s3_bucket }}" >> $GITHUB_STEP_SUMMARY
            if [[ -n "${{ needs.terraform-outputs.outputs.cloudfront_distribution_id }}" ]]; then
              echo "- **CloudFront Distribution**: ${{ needs.terraform-outputs.outputs.cloudfront_distribution_id }}" >> $GITHUB_STEP_SUMMARY
            fi
          fi
