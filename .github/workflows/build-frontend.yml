name: Frontend Build Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Build environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production
      api_base_url:
        description: 'API base URL, e.g. the Scaleway Serverless Container endpoint + /api/v1 (required for production)'
        required: false
        type: string


jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Install dependencies
        working-directory: ./frontend
        run: bun install --frozen-lockfile
        
      - name: Run tests
        working-directory: ./frontend
        run: bun test --run
        
      - name: Build for development
        if: github.event.inputs.environment != 'production' && github.ref != 'refs/heads/main'
        working-directory: ./frontend
        env:
          VITE_ENVIRONMENT: development
          VITE_API_BASE_URL: http://localhost:3000
        run: bun run build:dev
          
      - name: Build for production
        if: github.event.inputs.environment == 'production' || github.ref == 'refs/heads/main'
        working-directory: ./frontend
        env:
          VITE_ENVIRONMENT: production
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://placeholder-api.containers.fr-par.scw.cloud/api/v1' }}
        run: |
          # Use the provided input, or the placeholder if none was given
          if [ -z "${{ github.event.inputs.api_base_url }}" ]; then
            echo "Warning: No API base URL provided, using placeholder"
          fi
          
          bun run build:live
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: frontend/dist/
          retention-days: 30
          
      - name: Build summary
        run: |
          echo "## Frontend Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.environment || 'auto-detected' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Mode**: ${{ github.event.inputs.environment == 'production' || github.ref == 'refs/heads/main' && 'production' || 'development' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifacts**: Available for download" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "frontend/dist" ]; then
            echo "- **Build Size**: $(du -sh frontend/dist | cut -f1)" >> $GITHUB_STEP_SUMMARY
          fi
