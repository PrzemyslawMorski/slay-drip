name: Deploy Lambda Functions

on:
  push:
    branches: [main]
    paths:
      - "backend/lambda/**"
      - "terraform/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "development"
        type: choice
        options:
          - production
          - staging
          - development

permissions:
  id-token: write # Required for OIDC
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}

jobs:
  test:
    name: Test Lambda Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v4
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: backend/lambda/go.sum
      
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('backend/lambda/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      
      - run: |
          cd backend/lambda
          go test -race ./...
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

  build-and-deploy:
    name: Build and Deploy Lambda Functions
    needs: [test]
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'staging' || 'development') }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v4
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: backend/lambda/go.sum
      
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('backend/lambda/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build Lambda functions
        run: |
          cd backend/lambda
          chmod +x build.sh
          ./build.sh

      - name: Validate AWS credentials
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'staging' || 'development') }}"
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "❌ Error: AWS_ROLE_ARN is not set in the $ENVIRONMENT environment!"
            echo "Please configure the AWS_ROLE_ARN secret in your environment settings."
            echo "Go to Settings > Environments > $ENVIRONMENT > Add secret"
            echo "Name: AWS_ROLE_ARN"
            echo "Value: arn:aws:iam::YOUR_ACCOUNT_ID:role/YOUR_ROLE_NAME"
            exit 1
          fi
          echo "✅ AWS_ROLE_ARN is configured in $ENVIRONMENT environment"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Lambda Functions
        run: |
          cd backend/lambda
          ENVIRONMENT="${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'staging' || 'development') }}"
          echo "🚀 Deploying Lambda functions to $ENVIRONMENT environment..."
          
          # Deploy each Lambda function
          for function_dir in functions/*/; do
            if [ -d "$function_dir" ]; then
              function_name=$(basename "$function_dir")
              zip_file="${function_name}.zip"
              
              echo "📦 Deploying $function_name..."
              
              # Update Lambda function code
              aws lambda update-function-code \
                --function-name "slay-drip-${function_name}-${ENVIRONMENT}" \
                --zip-file "fileb://${zip_file}" \
                --region "${{ env.AWS_REGION }}"
              
              if [ $? -eq 0 ]; then
                echo "✅ Successfully deployed $function_name"
              else
                echo "❌ Failed to deploy $function_name"
                exit 1
              fi
            fi
          done
          
          echo "🎉 All Lambda functions deployed successfully!"
