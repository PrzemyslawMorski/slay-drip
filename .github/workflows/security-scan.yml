name: Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, develop ]
  workflow_dispatch:
  workflow_call:
    inputs:
      scan_paths:
        description: 'Paths to scan (comma-separated)'
        required: false
        default: '.'
        type: string
      fail_on_secrets:
        description: 'Fail workflow if secrets are found'
        required: false
        default: true
        type: boolean
      fail_on_vulnerabilities:
        description: 'Fail workflow if vulnerabilities are found'
        required: false
        default: true
        type: boolean
    outputs:
      secrets_found:
        description: 'Whether secrets were found'
        value: ${{ jobs.security-scan.outputs.secrets_found }}
      vulnerabilities_found:
        description: 'Whether vulnerabilities were found'
        value: ${{ jobs.dependency-scan.outputs.vulnerabilities_found }}

env:
  SCAN_PATHS: ${{ inputs.scan_paths || '.' }}
  EXCLUDE_PATHS: "node_modules,.git,.terraform,dist,build,.venv,__pycache__,.pytest_cache"
  FAIL_ON_SECRETS: ${{ inputs.fail_on_secrets || true }}
  FAIL_ON_VULNERABILITIES: ${{ inputs.fail_on_vulnerabilities || true }}

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    outputs:
      secrets_found: ${{ steps.secrets-check.outputs.found }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better scanning

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          pip install detect-secrets

      - name: Install Go TruffleHog
        run: |
          wget https://github.com/trufflesecurity/trufflehog/releases/download/v3.90.0/trufflehog_3.90.0_linux_amd64.tar.gz
          tar -xzf trufflehog_3.90.0_linux_amd64.tar.gz
          sudo mv trufflehog /usr/local/bin/
          trufflehog --version

      - name: Run TruffleHog scan
        id: trufflehog
        run: |
          echo "🔍 Running TruffleHog scan..."
          trufflehog filesystem --only-verified --fail --no-update . || {
            echo "❌ TruffleHog found potential secrets!"
            exit 1
          }
          echo "✅ TruffleHog scan passed"

      - name: Run detect-secrets scan
        id: detect-secrets
        run: |
          echo "🔍 Running detect-secrets scan..."
          detect-secrets scan || {
            echo "❌ detect-secrets found potential secrets!"
            exit 1
          }
          echo "✅ detect-secrets scan passed"

      - name: Check for environment files
        id: env-files
        run: |
          echo "🔍 Checking for environment files..."
          
          # Check for .env files
          if find . -name ".env*" -not -path "./.git/*" -not -path "./node_modules/*" | grep -q .; then
            echo "❌ Found .env files that should not be committed!"
            find . -name ".env*" -not -path "./.git/*" -not -path "./node_modules/*"
            exit 1
          fi
          
          # Check for config files with potential secrets
          if find . -name "config.json" -o -name "secrets.json" -o -name "*.pem" -o -name "*.key" -o -name "*.crt" -o -name "*.p12" | grep -q .; then
            echo "❌ Found potential secret files!"
            find . -name "config.json" -o -name "secrets.json" -o -name "*.pem" -o -name "*.key" -o -name "*.crt" -o -name "*.p12"
            exit 1
          fi
          
          echo "✅ No environment files found"

      - name: Check Terraform state files
        id: terraform-state
        run: |
          echo "🔍 Checking for Terraform state files..."
          
          # Check for .tfstate files
          if find . -name "*.tfstate*" -not -path "./.git/*" | grep -q .; then
            echo "❌ Found Terraform state files that should not be committed!"
            find . -name "*.tfstate*" -not -path "./.git/*"
            exit 1
          fi
          
          echo "✅ No Terraform state files found"

      - name: Check for hardcoded URLs
        id: hardcoded-urls
        run: |
          echo "🔍 Checking for hardcoded URLs..."
          
          # Check for hardcoded URLs that might contain secrets
          if grep -r --exclude-dir={.git,node_modules,.terraform,dist,build} -E "https?://[^/]*:[^/]*@" .; then
            echo "❌ Found URLs with embedded credentials!"
            grep -r --exclude-dir={.git,node_modules,.terraform,dist,build} -E "https?://[^/]*:[^/]*@" .
            exit 1
          fi
          
          echo "✅ No hardcoded URLs with credentials found"

      - name: Check for hardcoded secrets in Go files
        id: go-secrets
        run: |
          echo "🔍 Checking for hardcoded secrets in Go files..."
          
          # Check for hardcoded API keys, passwords, etc. in Go files
          if grep -r --include="*.go" --exclude-dir={.git,node_modules,.terraform,dist,build} -E "(password|secret|key|token)\s*[:=]\s*[\"'][^\"']{8,}[\"']" .; then
            echo "❌ Found potential hardcoded secrets in Go files!"
            grep -r --include="*.go" --exclude-dir={.git,node_modules,.terraform,dist,build} -E "(password|secret|key|token)\s*[:=]\s*[\"'][^\"']{8,}[\"']" .
            exit 1
          fi
          
          echo "✅ No hardcoded secrets found in Go files"

      - name: Check for hardcoded secrets in JS/TS files
        id: js-secrets
        run: |
          echo "🔍 Checking for hardcoded secrets in JS/TS files..."
          
          # Check for hardcoded API keys, passwords, etc. in JS/TS files
          if grep -r --include="*.js" --include="*.ts" --include="*.jsx" --include="*.tsx" --exclude-dir={.git,node_modules,.terraform,dist,build} -E "(password|secret|key|token)\s*[:=]\s*[\"'][^\"']{8,}[\"']" .; then
            echo "❌ Found potential hardcoded secrets in JS/TS files!"
            grep -r --include="*.js" --include="*.ts" --include="*.jsx" --include="*.tsx" --exclude-dir={.git,node_modules,.terraform,dist,build} -E "(password|secret|key|token)\s*[:=]\s*[\"'][^\"']{8,}[\"']" .
            exit 1
          fi
          
          echo "✅ No hardcoded secrets found in JS/TS files"

      - name: Set secrets check output
        id: secrets-check
        run: |
          if [ "${{ steps.trufflehog.outcome }}" == "success" ] && \
             [ "${{ steps.detect-secrets.outcome }}" == "success" ] && \
             [ "${{ steps.env-files.outcome }}" == "success" ] && \
             [ "${{ steps.terraform-state.outcome }}" == "success" ] && \
             [ "${{ steps.hardcoded-urls.outcome }}" == "success" ] && \
             [ "${{ steps.go-secrets.outcome }}" == "success" ] && \
             [ "${{ steps.js-secrets.outcome }}" == "success" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "found=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate security report
        id: report
        if: always()
        run: |
          echo "📊 Security Scan Report" >> $GITHUB_STEP_SUMMARY
          echo "=======================" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.trufflehog.outcome }}" == "success" ]; then
            echo "✅ **TruffleHog:** No secrets found" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **TruffleHog:** Potential secrets detected" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.detect-secrets.outcome }}" == "success" ]; then
            echo "✅ **detect-secrets:** No secrets found" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **detect-secrets:** Potential secrets detected" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.env-files.outcome }}" == "success" ]; then
            echo "✅ **Environment Files:** No .env files found" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Environment Files:** .env files detected" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.terraform-state.outcome }}" == "success" ]; then
            echo "✅ **Terraform State:** No state files found" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Terraform State:** State files detected" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.hardcoded-urls.outcome }}" == "success" ]; then
            echo "✅ **Hardcoded URLs:** No credentials in URLs" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Hardcoded URLs:** Credentials found in URLs" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.go-secrets.outcome }}" == "success" ]; then
            echo "✅ **Go Secrets:** No hardcoded secrets in Go files" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Go Secrets:** Hardcoded secrets found in Go files" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.js-secrets.outcome }}" == "success" ]; then
            echo "✅ **JS/TS Secrets:** No hardcoded secrets in JS/TS files" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **JS/TS Secrets:** Hardcoded secrets found in JS/TS files" >> $GITHUB_STEP_SUMMARY
          fi

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    outputs:
      vulnerabilities_found: ${{ steps.vulnerabilities-check.outputs.found }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run npm audit
        id: npm-audit
        run: |
          cd frontend
          npm audit --audit-level=high || {
            echo "❌ npm audit found high severity vulnerabilities!"
            exit 1
          }

      - name: Run npm outdated check
        run: |
          cd frontend
          echo "🔍 Checking for outdated packages..."
          npm outdated || echo "✅ All packages are up to date"

      - name: Check for known vulnerable packages
        id: vulnerable-packages
        run: |
          cd frontend
          echo "🔍 Checking for known vulnerable packages..."
          
          # Check for packages with known vulnerabilities
          VULNERABLE_PACKAGES=(
            "lodash"
            "moment"
            "jquery"
            "express"
            "debug"
          )
          
          FOUND_VULNERABLE=false
          
          for package in "${VULNERABLE_PACKAGES[@]}"; do
            if npm list "$package" >/dev/null 2>&1; then
              echo "⚠️  Found potentially vulnerable package: $package"
              FOUND_VULNERABLE=true
            fi
          done
          
          if [ "$FOUND_VULNERABLE" = true ]; then
            echo "⚠️  Consider updating or replacing vulnerable packages"
          else
            echo "✅ No known vulnerable packages found"
          fi

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Go dependency vulnerability scan
        id: go-audit
        run: |
          cd backend
          echo "🔍 Running Go vulnerability scan..."
          
          # Install govulncheck
          go install golang.org/x/vuln/cmd/govulncheck@latest
          
          # Run vulnerability check
          govulncheck ./... || {
            echo "❌ Go vulnerability scan found issues!"
            exit 1
          }
          
          echo "✅ Go vulnerability scan passed"

      - name: Set vulnerabilities check output
        id: vulnerabilities-check
        run: |
          if [ "${{ steps.npm-audit.outcome }}" == "success" ] && \
             [ "${{ steps.go-audit.outcome }}" == "success" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "found=true" >> $GITHUB_OUTPUT
          fi

  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint security rules
        run: |
          cd frontend
          npm run lint || echo "Linting completed with warnings"

      - name: Check for console.log statements
        run: |
          echo "🔍 Checking for console.log statements..."
          if grep -r "console\.log" frontend/src --exclude-dir=node_modules; then
            echo "⚠️  Found console.log statements (potential security risk)"
            echo "Consider removing console.log statements before production"
          else
            echo "✅ No console.log statements found"
          fi

      - name: Check for hardcoded values
        run: |
          echo "🔍 Checking for hardcoded values..."
          
          # Check for hardcoded IPs, URLs, etc.
          if grep -r --exclude-dir={node_modules,.git} -E "(localhost|127\.0\.0\.1|0\.0\.0\.0)" frontend/src; then
            echo "⚠️  Found hardcoded localhost/IP addresses"
          fi
          
          if grep -r --exclude-dir={node_modules,.git} -E "http://" frontend/src; then
            echo "⚠️  Found HTTP URLs (should use HTTPS in production)"
          fi

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Go security checks
        run: |
          cd backend
          echo "🔍 Running Go security checks..."
          
          # Check for race conditions
          go test -race ./... || echo "⚠️  Race condition tests failed"
          
          # Check for security issues with go vet
          go vet ./... || echo "⚠️  go vet found issues"
          
          # Check for unused imports and variables
          go vet -unusedresultfuncs ./... || echo "⚠️  Unused result functions found"

  notify:
    name: Security Scan Results
    runs-on: ubuntu-latest
    needs: [security-scan, dependency-scan, code-quality]
    if: always()
    
    steps:
      - name: Security Scan Summary
        run: |
          echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.security-scan.result }}" == "success" ]; then
            echo "✅ **Security Scan:** PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Security Scan:** FAILED - Secrets detected!" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.dependency-scan.result }}" == "success" ]; then
            echo "✅ **Dependency Scan:** PASSED (npm audit + govulncheck)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Dependency Scan:** FAILED - Vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.code-quality.result }}" == "success" ]; then
            echo "✅ **Code Quality:** PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  **Code Quality:** WARNINGS - Review recommended" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "- Review any failed scans" >> $GITHUB_STEP_SUMMARY
          echo "- Remove any detected secrets" >> $GITHUB_STEP_SUMMARY
          echo "- Update dependencies if vulnerabilities found" >> $GITHUB_STEP_SUMMARY 