name: Build and Deploy API Container (Scaleway)

on:
  push:
    branches: [main]
    paths:
      - "backend/lambda/**"
      - ".github/workflows/deploy-lambda-containers.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - live

permissions:
  contents: read

env:
  SCW_REGION: fr-par
  SCW_API_URL: https://api.scaleway.com

# Only one API deploy per environment at a time
concurrency:
  group: api-deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push API image
      working-directory: ./backend/lambda
      env:
        SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        SCW_REGION: ${{ env.SCW_REGION }}
      run: |
        ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
        echo "Building API container for environment: $ENVIRONMENT"

        chmod +x build-all-functions.sh
        ./build-all-functions.sh "$ENVIRONMENT"

  redeploy-container:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    needs: build-and-push

    steps:
    - name: Redeploy API container to pick up the new image
      env:
        SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      run: |
        ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
        CONTAINER_NAME="slay-drip-api-${ENVIRONMENT}"

        # Look up the Serverless Container by name
        CONTAINER_ID=$(curl -sf \
          -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
          "${SCW_API_URL}/containers/v1beta1/regions/${SCW_REGION}/containers?name=${CONTAINER_NAME}" \
          | jq -r '.containers[0].id // empty')

        if [ -z "$CONTAINER_ID" ]; then
          echo "⚠️  Container ${CONTAINER_NAME} not found. Deploy infrastructure first using Terraform."
          exit 0
        fi

        curl -sf -X POST \
          -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
          "${SCW_API_URL}/containers/v1beta1/regions/${SCW_REGION}/containers/${CONTAINER_ID}/deploy"

        echo "✅ Redeploy requested for ${CONTAINER_NAME} (${CONTAINER_ID})"

  test-deployment:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    needs: redeploy-container

    steps:
    - name: Get API endpoint
      id: get-api-url
      env:
        SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      run: |
        ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
        CONTAINER_NAME="slay-drip-api-${ENVIRONMENT}"

        ENDPOINT=$(curl -sf \
          -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
          "${SCW_API_URL}/containers/v1beta1/regions/${SCW_REGION}/containers?name=${CONTAINER_NAME}" \
          | jq -r '.containers[0].domain_name // empty')

        if [ -n "$ENDPOINT" ]; then
          echo "api_url=https://${ENDPOINT}/api/v1" >> $GITHUB_OUTPUT
        else
          echo "⚠️  API container not found. Infrastructure may not be deployed yet."
        fi
      env:
        SCW_REGION: ${{ env.SCW_REGION }}

    - name: Test API endpoints
      env:
        API_URL: ${{ steps.get-api-url.outputs.api_url }}
      run: |
        if [ -z "$API_URL" ]; then
          echo "⚠️  Skipping API tests - infrastructure not deployed"
          exit 0
        fi

        # Give the new revision time to start
        sleep 30

        curl -f "${API_URL}/items" || {
          echo "❌ get-items endpoint test failed"
          exit 1
        }

        echo "✅ API endpoints test passed"
