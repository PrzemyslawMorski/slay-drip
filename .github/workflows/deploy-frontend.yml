name: Deploy Frontend to Scaleway Object Storage

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - live

permissions:
  contents: read

env:
  SCW_REGION: fr-par
  APP_NAME: slay-drip

jobs:
  test:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test --run --coverage

      - name: Run linting
        run: bun run lint || echo "Linting completed"

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [test]
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build
        env:
          CI: false
          GENERATE_SOURCEMAP: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 1

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [build]
    environment: dev
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/

      - name: Deploy frontend
        uses: ./.github/actions/deploy-frontend
        with:
          environment: dev
          scw-access-key: ${{ secrets.SCW_ACCESS_KEY }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}
          region: ${{ env.SCW_REGION }}
          app-name: ${{ env.APP_NAME }}

  deploy-live:
    name: Deploy to Live
    runs-on: ubuntu-latest
    needs: [build]
    environment: live
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'live'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/

      - name: Deploy frontend
        uses: ./.github/actions/deploy-frontend
        with:
          environment: live
          scw-access-key: ${{ secrets.SCW_ACCESS_KEY }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}
          region: ${{ env.SCW_REGION }}
          app-name: ${{ env.APP_NAME }}

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-live]
    if: always()

    steps:
      - name: Deployment Summary
        run: |
          echo "## 🚀 Frontend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.deploy-dev.result }}" == "success" ]; then
            echo "✅ **Development deployment:** Success" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy-dev.result }}" == "failure" ]; then
            echo "❌ **Development deployment:** Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.deploy-live.result }}" == "success" ]; then
            echo "✅ **Live deployment:** Success" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy-live.result }}" == "failure" ]; then
            echo "❌ **Live deployment:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
