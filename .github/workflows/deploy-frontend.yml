          else
            BUCKET_NAME=$(terraform output -raw frontend_bucket_name)
            echo "🌐 Frontend deployed to S3: http://$BUCKET_NAME.s3-website-${{ env.AWS_REGION }}.amazonaws.com"
          fi
        env:
          TF_VAR_environment: production

      - name: Print OIDC info
        run: |
          echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY"
          echo "GITHUB_REF: $GITHUB_REF"
          echo "GITHUB_ACTOR: $GITHUB_ACTOR"

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-development, deploy-staging, deploy-production]
    if: always()

    steps:
      - name: Deployment Summary
        run: |
          echo "## 🚀 Frontend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.deploy-development.result }}" == "success" ]; then
            echo "✅ **Development deployment:** Success" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy-development.result }}" == "failure" ]; then
            echo "❌ **Development deployment:** Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.deploy-staging.result }}" == "success" ]; then
            echo "✅ **Staging deployment:** Success" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy-staging.result }}" == "failure" ]; then
            echo "❌ **Staging deployment:** Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.deploy-production.result }}" == "success" ]; then
            echo "✅ **Production deployment:** Success" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy-production.result }}" == "failure" ]; then
            echo "❌ **Production deployment:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
