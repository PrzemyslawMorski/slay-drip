# Local cloud stand-ins for development and tests. See docs/local-development.md
# and docs/adr/0005-local-cloud-emulation.md.
#
# Every credential here is a throwaway value for this machine only. It must never be
# used outside local development, and no production value may live in this file.
name: slay-drip-local

services:
  database:
    # Same engine as Scaleway Managed PostgreSQL. Pinned: bump deliberately.
    image: postgres:17
    environment:
      POSTGRES_DB: slaydrip
      POSTGRES_USER: slaydrip
      POSTGRES_PASSWORD: slaydrip-local-secret
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slaydrip -d slaydrip"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  object-storage:
    # Stand-in for Scaleway Object Storage (S3 API). Pinned: bump deliberately.
    image: chrislusf/seaweedfs:4.22
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - ./infra/dev/s3.json:/etc/seaweedfs/s3.json:ro
      - object-storage-data:/data
    restart: unless-stopped

  keycloak:
    # Stand-in for the identity provider (ADR-0010). Pinned: bump deliberately.
    # Tag checked on Docker Hub 2026-10-28 (latest stable 26.8.x).
    image: keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    env_file:
      - ./infra/dev/keycloak/local-admin.conf
    environment:
      KC_HOSTNAME: http://127.0.0.1:8180
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./infra/dev/keycloak/realm:/opt/keycloak/data/import:ro
    healthcheck:
      # The image ships bash but no curl. The management port (9000) serves /health/ready.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  api:
    # Throwaway local values, same as the database service. Never used outside local development.
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://slaydrip:slaydrip-local-secret@database:5432/slaydrip?sslmode=disable
      OIDC_ISSUER_URL: http://127.0.0.1:8180/realms/slay-drip
      # Issuer stays on the host URL so it matches the token iss claim (KC_HOSTNAME). The JWKS
      # fetch runs inside this container, so it uses the container-network host.
      OIDC_JWKS_URL: http://keycloak:8080/realms/slay-drip/protocol/openid-connect/certs
      OIDC_AUDIENCE: slay-drip-api
      S3_ENDPOINT: http://object-storage:8333
      S3_REGION: fr-par
      S3_BUCKET: slay-drip-local
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY: slaydrip-local
      S3_SECRET_KEY: slaydrip-local-secret
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      database:
        condition: service_healthy
      object-storage:
        condition: service_started
      keycloak:
        condition: service_healthy
    restart: unless-stopped

volumes:
  database-data:
  object-storage-data:
